<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OSOG Lab - Playground</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
      body {
        overflow: hidden; /* Fullscreen app feel */
        background-color: #1e1e1e;
        color: #e0e0e0;
      }
      .sidebar {
        width: 350px;
        background-color: #252526;
        border-right: 1px solid #3e3e42;
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      .sidebar-header {
        padding: 1rem;
        border-bottom: 1px solid #3e3e42;
        font-weight: bold;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .sidebar-content {
        flex-grow: 1;
        overflow-y: auto;
        padding: 1rem;
      }
      .main-area {
        flex-grow: 1;
        display: flex;
        flex-direction: column;
        height: 100vh;
        position: relative;
        background-color: #1e1e1e;
      }
      .toolbar {
        height: 50px;
        background-color: #2d2d2d;
        border-bottom: 1px solid #3e3e42;
        display: flex;
        align-items: center;
        padding: 0 1rem;
        gap: 1rem;
      }
      .canvas-container {
        flex-grow: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        position: relative;
        background-image: radial-gradient(#333 1px, transparent 1px);
        background-size: 20px 20px;
      }
      #mainImage {
        max-width: 95%;
        max-height: 95%;
        object-fit: contain;
        box-shadow: 0 0 20px rgba(0,0,0,0.5);
      }
      .heads-panel {
        height: 120px;
        background-color: #252526;
        border-top: 1px solid #3e3e42;
        display: flex;
        align-items: center;
        padding: 0 1rem;
        gap: 1rem;
        overflow-x: auto;
      }
      .head-thumb {
        width: 100px;
        height: 100px;
        background-color: #000;
        border: 2px solid #3e3e42;
        cursor: pointer;
        position: relative;
        border-radius: 4px;
        overflow: hidden;
        transition: border-color 0.2s;
      }
      .head-thumb:hover {
        border-color: #0d6efd;
      }
      .head-thumb.active {
        border-color: #0d6efd;
        box-shadow: 0 0 0 2px rgba(13, 110, 253, 0.25);
      }
      .head-thumb img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .head-label {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        background: rgba(0,0,0,0.7);
        color: #fff;
        font-size: 0.75rem;
        padding: 2px 4px;
        text-align: center;
      }
      
      /* Compact controls */
      .form-label { margin-bottom: 0.2rem; font-size: 0.85rem; color: #ccc; }
      .form-control-sm, .form-select-sm { font-size: 0.8rem; background-color: #3e3e42; border-color: #555; color: #fff; }
      .form-range { height: 1rem; }
      .accordion-item { background-color: transparent; border-color: #3e3e42; }
      .accordion-button { background-color: #2d2d2d; color: #e0e0e0; font-size: 0.9rem; padding: 0.75rem; }
      .accordion-button:not(.collapsed) { background-color: #37373d; color: #fff; box-shadow: none; }
      .accordion-body { padding: 0.75rem; }
      
      /* Scrollbar */
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-track { background: #1e1e1e; }
      ::-webkit-scrollbar-thumb { background: #424242; border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: #505050; }
    </style>
  </head>
  <body>
    <div class="d-flex">
      <!-- Sidebar Controls -->
      <div class="sidebar">
        <div class="sidebar-header">
          <span><i class="bi bi-bezier2"></i> OSOG Lab</span>
          <a href="/" class="btn btn-sm btn-outline-secondary" title="Back to Dashboard"><i class="bi bi-box-arrow-left"></i></a>
        </div>
        <div class="sidebar-content">
          <div class="d-grid gap-2 mb-3">
            <button class="btn btn-primary btn-sm" id="btnRegenerate"><i class="bi bi-arrow-repeat"></i> Regenerate (Space)</button>
          </div>
          
          <div class="accordion" id="controlsAccordion">
            
            <!-- Physics -->
            <div class="accordion-item">
              <h2 class="accordion-header">
                <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#collapsePhysics">
                  Particles & Physics
                </button>
              </h2>
              <div id="collapsePhysics" class="accordion-collapse collapse show" data-bs-parent="#controlsAccordion">
                <div class="accordion-body">
                  <div class="form-check form-switch mb-2">
                    <input class="form-check-input" type="checkbox" id="synEnable3d">
                    <label class="form-check-label" for="synEnable3d">3D Rotation</label>
                  </div>
                  
                  <!-- Particle Types -->
                  <div class="accordion accordion-flush mt-2" id="particlesAccordion">
                    
                    <!-- Rods -->
                    <div class="accordion-item border-0">
                      <h2 class="accordion-header">
                        <div class="d-flex align-items-center w-100">
                          <div class="ps-3 pe-2 bg-dark-subtle d-flex align-items-center" style="height: 100%; border-bottom: 1px solid #3e3e42;">
                             <div class="form-check form-switch m-0">
                               <input class="form-check-input" type="checkbox" id="synRodEnable" checked>
                             </div>
                          </div>
                          <button class="accordion-button collapsed py-2 ps-1" type="button" data-bs-toggle="collapse" data-bs-target="#collapseRods">
                            Rods
                          </button>
                        </div>
                      </h2>
                      <div id="collapseRods" class="accordion-collapse collapse" data-bs-parent="#particlesAccordion">
                        <div class="accordion-body pt-0 pb-2 ps-4">
                          <label class="form-label">Count</label>
                          <div class="input-group input-group-sm mb-1">
                            <input type="number" class="form-control" id="synRodCountLo" value="50">
                            <span class="input-group-text">-</span>
                            <input type="number" class="form-control" id="synRodCountHi" value="200">
                          </div>
                          <label class="form-label">Length (px)</label>
                          <div class="input-group input-group-sm mb-1">
                            <input type="number" class="form-control" id="synRodLenLo" value="30">
                            <span class="input-group-text">-</span>
                            <input type="number" class="form-control" id="synRodLenHi" value="150">
                          </div>
                          <label class="form-label">Aspect (W/L)</label>
                          <div class="input-group input-group-sm mb-1">
                            <input type="number" class="form-control" id="synRodAspLo" value="0.02" step="0.01">
                            <span class="input-group-text">-</span>
                            <input type="number" class="form-control" id="synRodAspHi" value="0.10" step="0.01">
                          </div>
                          <label class="form-label">Material</label>
                          <select class="form-select form-select-sm mb-1" id="synRodMaterial">
                            <option value="standard">Standard (Plastic)</option>
                            <option value="crystal_fibrous">Fibrous Crystal (Needles)</option>
                            <option value="crystal_smooth">Smooth Crystal (Salts)</option>
                            <option value="amorphous">Amorphous (Aggregates)</option>
                            <option value="glass">Glass</option>
                          </select>
                        </div>
                      </div>
                    </div>

                    <!-- Spheres -->
                    <div class="accordion-item border-0">
                      <h2 class="accordion-header">
                        <div class="d-flex align-items-center w-100">
                          <div class="ps-3 pe-2 bg-dark-subtle d-flex align-items-center" style="height: 100%; border-bottom: 1px solid #3e3e42;">
                             <div class="form-check form-switch m-0">
                               <input class="form-check-input" type="checkbox" id="synSphereEnable">
                             </div>
                          </div>
                          <button class="accordion-button collapsed py-2 ps-1" type="button" data-bs-toggle="collapse" data-bs-target="#collapseSpheres">
                            Spheres
                          </button>
                        </div>
                      </h2>
                      <div id="collapseSpheres" class="accordion-collapse collapse" data-bs-parent="#particlesAccordion">
                        <div class="accordion-body pt-0 pb-2 ps-4">
                          <label class="form-label">Count</label>
                          <div class="input-group input-group-sm mb-1">
                            <input type="number" class="form-control" id="synSphereCountLo" value="10">
                            <span class="input-group-text">-</span>
                            <input type="number" class="form-control" id="synSphereCountHi" value="50">
                          </div>
                          <label class="form-label">Diameter (px)</label>
                          <div class="input-group input-group-sm mb-1">
                            <input type="number" class="form-control" id="synSphereDiamLo" value="20">
                            <span class="input-group-text">-</span>
                            <input type="number" class="form-control" id="synSphereDiamHi" value="100">
                          </div>
                          <label class="form-label">Material</label>
                          <select class="form-select form-select-sm mb-1" id="synSphereMaterial">
                            <option value="standard">Standard</option>
                            <option value="glass">Glass (Beads)</option>
                            <option value="amorphous">Amorphous</option>
                            <option value="air">Air Bubble</option>
                            <option value="oil">Oil Droplet</option>
                          </select>
                        </div>
                      </div>
                    </div>

                    <!-- Cubes -->
                    <div class="accordion-item border-0">
                      <h2 class="accordion-header">
                        <div class="d-flex align-items-center w-100">
                          <div class="ps-3 pe-2 bg-dark-subtle d-flex align-items-center" style="height: 100%; border-bottom: 1px solid #3e3e42;">
                             <div class="form-check form-switch m-0">
                               <input class="form-check-input" type="checkbox" id="synCubeEnable">
                             </div>
                          </div>
                          <button class="accordion-button collapsed py-2 ps-1" type="button" data-bs-toggle="collapse" data-bs-target="#collapseCubes">
                            Cubes
                          </button>
                        </div>
                      </h2>
                      <div id="collapseCubes" class="accordion-collapse collapse" data-bs-parent="#particlesAccordion">
                        <div class="accordion-body pt-0 pb-2 ps-4">
                          <label class="form-label">Count</label>
                          <div class="input-group input-group-sm mb-1">
                            <input type="number" class="form-control" id="synCubeCountLo" value="10">
                            <span class="input-group-text">-</span>
                            <input type="number" class="form-control" id="synCubeCountHi" value="50">
                          </div>
                          <label class="form-label">Size (px)</label>
                          <div class="input-group input-group-sm mb-1">
                            <input type="number" class="form-control" id="synCubeSizeLo" value="20">
                            <span class="input-group-text">-</span>
                            <input type="number" class="form-control" id="synCubeSizeHi" value="100">
                          </div>
                          <label class="form-label">Material</label>
                          <select class="form-select form-select-sm mb-1" id="synCubeMaterial">
                            <option value="standard">Standard</option>
                            <option value="crystal_smooth">Smooth Crystal</option>
                            <option value="glass">Glass</option>
                          </select>
                        </div>
                      </div>
                    </div>

                    <!-- Plates -->
                    <div class="accordion-item border-0">
                      <h2 class="accordion-header">
                        <div class="d-flex align-items-center w-100">
                          <div class="ps-3 pe-2 bg-dark-subtle d-flex align-items-center" style="height: 100%; border-bottom: 1px solid #3e3e42;">
                             <div class="form-check form-switch m-0">
                               <input class="form-check-input" type="checkbox" id="synPlateEnable">
                             </div>
                          </div>
                          <button class="accordion-button collapsed py-2 ps-1" type="button" data-bs-toggle="collapse" data-bs-target="#collapsePlates">
                            Plates
                          </button>
                        </div>
                      </h2>
                      <div id="collapsePlates" class="accordion-collapse collapse" data-bs-parent="#particlesAccordion">
                        <div class="accordion-body pt-0 pb-2 ps-4">
                          <label class="form-label">Count</label>
                          <div class="input-group input-group-sm mb-1">
                            <input type="number" class="form-control" id="synPlateCountLo" value="10">
                            <span class="input-group-text">-</span>
                            <input type="number" class="form-control" id="synPlateCountHi" value="50">
                          </div>
                          <label class="form-label">Size (px)</label>
                          <div class="input-group input-group-sm mb-1">
                            <input type="number" class="form-control" id="synPlateSizeLo" value="30">
                            <span class="input-group-text">-</span>
                            <input type="number" class="form-control" id="synPlateSizeHi" value="150">
                          </div>
                          <label class="form-label">Aspect (W/L)</label>
                          <div class="input-group input-group-sm mb-1">
                            <input type="number" class="form-control" id="synPlateAspLo" value="0.1" step="0.1">
                            <span class="input-group-text">-</span>
                            <input type="number" class="form-control" id="synPlateAspHi" value="0.8" step="0.1">
                          </div>
                          <label class="form-label">Thickness (H/W)</label>
                          <div class="input-group input-group-sm mb-1">
                            <input type="number" class="form-control" id="synPlateThickLo" value="0.05" step="0.01">
                            <span class="input-group-text">-</span>
                            <input type="number" class="form-control" id="synPlateThickHi" value="0.2" step="0.01">
                          </div>
                          <label class="form-label">Material</label>
                          <select class="form-select form-select-sm mb-1" id="synPlateMaterial">
                            <option value="standard">Standard</option>
                            <option value="crystal_smooth">Smooth Crystal</option>
                            <option value="glass">Glass</option>
                          </select>
                        </div>
                      </div>
                    </div>

                  </div>
                </div>
              </div>
            </div>

            <!-- Crystal Physics & Morphology -->
            <div class="accordion-item">
              <h2 class="accordion-header">
                <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseMorphology">
                  Physics & Morphology
                </button>
              </h2>
              <div id="collapseMorphology" class="accordion-collapse collapse" data-bs-parent="#controlsAccordion">
                <div class="accordion-body">
                  <!-- Surface Roughness -->
                  <div class="mb-2">
                    <label class="form-label d-flex justify-content-between">Surface Roughness <span id="lblRoughness">0.0</span></label>
                    <input type="range" class="form-range" id="synRoughness" min="0" max="1" step="0.05" value="0.0">
                  </div>
                  
                  <!-- Polarity (Dark Crystals) -->
                  <div class="mb-2">
                     <label class="form-label d-flex justify-content-between">Polarity Flip (Dark) <span id="lblPolarity">0.0</span></label>
                     <input type="range" class="form-range" id="synPolarity" min="0" max="1" step="0.05" value="0.0">
                  </div>

                  <hr>

                  <!-- Agglomeration -->
                  <div class="mb-2">
                    <label class="form-label d-flex justify-content-between">Agglomeration (Clumping) <span id="lblAgglo">0.003</span></label>
                    <input type="range" class="form-range" id="synAgglo" min="0" max="0.01" step="0.0001" value="0.003">
                    <div class="form-text text-muted" style="font-size:0.75rem;">Higher values create more fused clusters.</div>
                  </div>

                  <hr>
                  
                  <!-- Shape Mode (Defects) -->
                  <div class="mb-2">
                    <label class="form-label">Shape Mode / Defects</label>
                    <select class="form-select form-select-sm" id="synShapeMode">
                      <option value="straight">Straight (Perfect)</option>
                      <option value="wavy">Wavy (Curved)</option>
                      <option value="kink">Kinked (Bent)</option>
                      <option value="noisy">Noisy (Rough Surface)</option>
                    </select>
                  </div>

                </div>
              </div>
            </div>

            <!-- Optics -->
            <div class="accordion-item">
              <h2 class="accordion-header">
                <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseOptics">
                  Optics & Microscopy
                </button>
              </h2>
              <div id="collapseOptics" class="accordion-collapse collapse" data-bs-parent="#controlsAccordion">
                <div class="accordion-body">
                  <div class="mb-3">
                    <label class="form-label">Mode</label>
                    <select class="form-select form-select-sm" id="synOpticsMode">
                      <option value="dic">DIC (Differential Interference)</option>
                      <option value="brightfield">Brightfield</option>
                      <option value="polarization">Polarization</option>
                      <option value="fluorescence">Fluorescence</option>
                      <option value="shadowgraphy">Shadowgraphy</option>
                    </select>
                  </div>
                  
                  <div class="mb-2">
                    <label class="form-label d-flex justify-content-between">Polarizer Angle <span id="lblPolAngle">0°</span></label>
                    <input type="range" class="form-range" id="synPolarizerAngle" min="0" max="180" step="1" value="0">
                  </div>

                  <div class="mb-2">
                    <label class="form-label d-flex justify-content-between">Shadow Gain <span id="lblShGain">10</span></label>
                    <input type="range" class="form-range" id="synShGain" min="1" max="50" step="1" value="10">
                  </div>
                </div>
              </div>
            </div>

            <!-- Sensor -->
            <div class="accordion-item">
              <h2 class="accordion-header">
                <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseSensor">
                  Sensor & Artifacts
                </button>
              </h2>
              <div id="collapseSensor" class="accordion-collapse collapse" data-bs-parent="#controlsAccordion">
                <div class="accordion-body">
                  <div class="mb-2">
                    <label class="form-label d-flex justify-content-between">Noise <span id="lblNoise">0.0</span></label>
                    <input type="range" class="form-range" id="synBgNoise" min="0" max="20" step="0.1" value="0.0">
                  </div>
                  <div class="mb-2">
                    <label class="form-label d-flex justify-content-between">Blur <span id="lblBlur">0.0</span></label>
                    <input type="range" class="form-range" id="synBlur" min="0" max="5" step="0.1" value="0.0">
                  </div>
                  <div class="mb-2">
                    <label class="form-label d-flex justify-content-between">Vignette <span id="lblVignette">0.0</span></label>
                    <input type="range" class="form-range" id="synVignette" min="0" max="1" step="0.01" value="0.0">
                  </div>
                  <div class="form-check form-switch mb-2">
                    <input class="form-check-input" type="checkbox" id="synTiltEnable" checked>
                    <label class="form-check-label" for="synTiltEnable">Tilt Gradient</label>
                  </div>
                  <div class="form-check form-switch mb-2">
                    <input class="form-check-input" type="checkbox" id="synReliefEnable" checked>
                    <label class="form-check-label" for="synReliefEnable">Background Texture</label>
                  </div>
                </div>
              </div>
            </div>
            
            <!-- Artifacts & Negatives -->
            <div class="accordion-item">
              <h2 class="accordion-header">
                <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseArtifacts">
                  Artifacts & Negatives
                </button>
              </h2>
              <div id="collapseArtifacts" class="accordion-collapse collapse" data-bs-parent="#controlsAccordion">
                <div class="accordion-body">
                  
                  <!-- Bubbles -->
                  <div class="form-check form-switch mb-1">
                    <input class="form-check-input" type="checkbox" id="synBubbleEnable">
                    <label class="form-check-label" for="synBubbleEnable">Bubbles</label>
                  </div>
                  <div class="ps-3 mb-2 border-start border-secondary">
                     <label class="form-label">Count</label>
                     <div class="input-group input-group-sm mb-1">
                       <input type="number" class="form-control" id="synBubbleCountLo" value="5">
                       <span class="input-group-text">-</span>
                       <input type="number" class="form-control" id="synBubbleCountHi" value="20">
                     </div>
                     <label class="form-label">Diameter (px)</label>
                     <div class="input-group input-group-sm mb-1">
                       <input type="number" class="form-control" id="synBubbleDiamLo" value="10">
                       <span class="input-group-text">-</span>
                       <input type="number" class="form-control" id="synBubbleDiamHi" value="50">
                     </div>
                     <label class="form-label">Material</label>
                     <select class="form-select form-select-sm mb-1" id="synBubbleMaterial">
                       <option value="air">Air</option>
                       <option value="standard">Standard</option>
                     </select>
                  </div>

                  <!-- Droplets -->
                  <div class="form-check form-switch mb-1">
                    <input class="form-check-input" type="checkbox" id="synDropletEnable">
                    <label class="form-check-label" for="synDropletEnable">Droplets</label>
                  </div>
                  <div class="ps-3 mb-2 border-start border-secondary">
                     <label class="form-label">Count</label>
                     <div class="input-group input-group-sm mb-1">
                       <input type="number" class="form-control" id="synDropletCountLo" value="5">
                       <span class="input-group-text">-</span>
                       <input type="number" class="form-control" id="synDropletCountHi" value="20">
                     </div>
                     <label class="form-label">Diameter (px)</label>
                     <div class="input-group input-group-sm mb-1">
                       <input type="number" class="form-control" id="synDropletDiamLo" value="10">
                       <span class="input-group-text">-</span>
                       <input type="number" class="form-control" id="synDropletDiamHi" value="50">
                     </div>
                     <label class="form-label">Material</label>
                     <select class="form-select form-select-sm mb-1" id="synDropletMaterial">
                       <option value="oil">Oil</option>
                       <option value="standard">Standard</option>
                     </select>
                  </div>
                  
                  <!-- Fouling -->
                  <div class="form-check form-switch mb-1">
                    <input class="form-check-input" type="checkbox" id="synFoulingEnable">
                    <label class="form-check-label" for="synFoulingEnable">Lens Fouling</label>
                  </div>
                  <div class="ps-3 mb-2 border-start border-secondary">
                     <label class="form-label d-flex justify-content-between">Probability <span id="lblFoulingProb">0.3</span></label>
                     <input type="range" class="form-range" id="synFoulingProb" min="0" max="1" step="0.05" value="0.3">
                     
                     <label class="form-label">Count</label>
                     <div class="input-group input-group-sm mb-1">
                       <input type="number" class="form-control" id="synFoulingCountLo" value="1">
                       <span class="input-group-text">-</span>
                       <input type="number" class="form-control" id="synFoulingCountHi" value="5">
                     </div>
                     
                     <label class="form-label d-flex justify-content-between">Opacity <span id="lblFoulingOp">0.5</span></label>
                     <input type="range" class="form-range" id="synFoulingOp" min="0" max="1" step="0.05" value="0.5">
                  </div>

                  <hr>

                  <div class="form-check form-switch mb-2">
                    <input class="form-check-input" type="checkbox" id="synGhostEnable">
                    <label class="form-check-label" for="synGhostEnable">Enable Ghosts</label>
                  </div>
                  <div class="mb-2">
                    <label class="form-label">Ghost Fraction</label>
                    <input type="range" class="form-range" id="synGhostFraction" min="0" max="2" step="0.1" value="0.2">
                  </div>
                  <hr>
                  <div class="mb-2">
                    <label class="form-label">Debris Rate</label>
                    <input type="range" class="form-range" id="synDebrisRate" min="0" max="1" step="0.01" value="0.0">
                  </div>
                </div>
              </div>
            </div>

          </div>
        </div>
        <div class="p-3 border-top border-secondary">
           <div class="d-grid">
             <button class="btn btn-outline-info btn-sm" onclick="savePresetPrompt()">Save Preset</button>
           </div>
        </div>
      </div>

      <!-- Main Area -->
      <div class="main-area">
        <div class="toolbar">
          <span class="text-light fw-bold" id="viewTitle">Optical Output</span>
          <div class="vr mx-2 bg-secondary"></div>
          <button class="btn btn-sm btn-outline-light" onclick="toggleObb()" id="btnObb">Toggle OBB</button>
          <span class="ms-auto text-muted small" id="statusText">Ready</span>
        </div>
        
        <div class="canvas-container" id="canvasContainer">
          <img id="mainImage" src="" alt="Generated Preview" style="display:none;">
          <canvas id="obbCanvas" style="position:absolute; pointer-events:none; display:none;"></canvas>
          
          <div id="loadingOverlay" class="position-absolute top-50 start-50 translate-middle" style="display:none;">
            <div class="spinner-grow text-primary" role="status"></div>
          </div>
        </div>

        <div class="heads-panel">
          <div class="head-thumb active" onclick="switchHead('optical')" id="thumb-optical">
            <img id="img-optical" src="">
            <div class="head-label">Optical</div>
          </div>
          <div class="head-thumb" onclick="switchHead('height')" id="thumb-height">
            <img id="img-height" src="">
            <div class="head-label">Height</div>
          </div>
          <div class="head-thumb" onclick="switchHead('depth')" id="thumb-depth">
            <img id="img-depth" src="">
            <div class="head-label">Depth</div>
          </div>
          <div class="head-thumb" onclick="switchHead('mask')" id="thumb-mask">
            <img id="img-mask" src="">
            <div class="head-label">Mask</div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/playground.js?v=2"></script>
  </body>
</html>
